services:
  gateway:
    build:
      context: ./gateway-startup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: DEBUG
      HTTP_ADDRESS: 0.0.0.0:8080
      AUTH_GRPC_ADDR: auth:50051
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_healthy

  auth:
    build:
      context: ./auth-startup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: DEBUG
      GRPC_AUTH_ADDR: 0.0.0.0:50051
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof auth-startup >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./auth-startup/migrations/00001_init.up.sql:/docker-entrypoint-initdb.d/00001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:
