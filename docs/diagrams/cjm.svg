<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1615px;height:300px;background:#FFFFFF;" width="1615px" height="300px" viewBox="0 0 1615 300" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="643.288" y="24.966" fill="#000" font-size="14" textLength="321.425" font-weight="700">KLoad — CJM: регистрация и начало работы</text></g><!--entity intro--><g class="entity" data-qualified-name="intro" id="ent0001" data-source-line="6"><rect x="6" y="52.068" width="209.209" height="96.272" fill="#E8F3FF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="16" y="77.034" fill="#000" font-size="14" textLength="96.642">1. Знакомство</text><text x="16" y="96.102" fill="#000" font-size="14" textLength="106.694">Канал: frontend</text><text x="16" y="115.17" fill="#000" font-size="14" textLength="177.785">Действие: открыть форму</text><text x="16" y="134.238" fill="#000" font-size="14" textLength="189.209">Ожидание: понятный старт</text></g><!--entity request--><g class="entity" data-qualified-name="request" id="ent0002" data-source-line="7"><rect x="326" y="52.068" width="210.441" height="96.272" fill="#E8F3FF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="336" y="77.034" fill="#000" font-size="14" textLength="118.734">2. Запрос письма</text><text x="336" y="96.102" fill="#000" font-size="14" textLength="150.863">POST /register/request</text><text x="336" y="115.17" fill="#000" font-size="14" textLength="77.224">Ввод: email</text><text x="336" y="134.238" fill="#000" font-size="14" textLength="190.441">Ожидание: письмо пришло</text></g><!--entity confirm--><g class="entity" data-qualified-name="confirm" id="ent0003" data-source-line="8"><rect x="724.5" y="52.068" width="171.409" height="96.272" fill="#FFF2D7" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="734.5" y="77.034" fill="#000" font-size="14" textLength="125.818">3. Подтверждение</text><text x="734.5" y="96.102" fill="#000" font-size="14" textLength="129.513">Письмо → frontend</text><text x="734.5" y="115.17" fill="#000" font-size="14" textLength="151.409">POST /register/confirm</text><text x="734.5" y="134.238" fill="#000" font-size="14" textLength="136.387">Ввод: token + userId</text></g><!--entity complete--><g class="entity" data-qualified-name="complete" id="ent0004" data-source-line="9"><rect x="1009" y="52.068" width="235.431" height="96.272" fill="#E3F5E8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1019" y="77.034" fill="#000" font-size="14" textLength="102.34">4. Завершение</text><text x="1019" y="96.102" fill="#000" font-size="14" textLength="161.615">POST /register/complete</text><text x="1019" y="115.17" fill="#000" font-size="14" textLength="215.431">Ввод: пароль + временный JWT</text><text x="1019" y="134.238" fill="#000" font-size="14" textLength="180.767">Результат: access + refresh</text></g><!--entity returning--><g class="entity" data-qualified-name="returning" id="ent0005" data-source-line="10"><rect x="1322.5" y="52.068" width="234.213" height="96.272" fill="#E3F5E8" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1332.5" y="77.034" fill="#000" font-size="14" textLength="71.022">5. Возврат</text><text x="1332.5" y="96.102" fill="#000" font-size="14" textLength="112.098">POST /auth/login</text><text x="1332.5" y="115.17" fill="#000" font-size="14" textLength="147.615">Затем refresh / logout</text><text x="1332.5" y="134.238" fill="#000" font-size="14" textLength="214.213">Результат: управляемая сессия</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="18"><path d="M251,166.568 L251,211.98 A0,0 0 0 0 251,211.98 L610.949,211.98 A0,0 0 0 0 610.949,211.98 L610.949,176.568 L600.949,166.568 L435,166.568 L431,148.313 L427,166.568 L251,166.568 A0,0 0 0 0 251,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M600.949,166.568 L600.949,176.568 L610.949,176.568 L600.949,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="257" y="185.465" fill="#000" font-size="13" textLength="309.101">Точка затруднения: письмо может задержаться.</text><text x="257" y="203.171" fill="#000" font-size="13" textLength="338.949">Действие: /register/repeat-email с лимитом запросов.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="22"><path d="M647,166.568 L647,211.98 A0,0 0 0 0 647,211.98 L973.253,211.98 A0,0 0 0 0 973.253,211.98 L973.253,176.568 L963.253,166.568 L814,166.568 L810,148.313 L806,166.568 L647,166.568 A0,0 0 0 0 647,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M963.253,166.568 L963.253,176.568 L973.253,176.568 L963.253,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="653" y="185.465" fill="#000" font-size="13" textLength="305.253">Точка затруднения: ссылка или токен устарели.</text><text x="653" y="203.171" fill="#000" font-size="13" textLength="240.955">Действие: повторный запрос письма.</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="26"><path d="M1280,166.568 L1280,211.98 A0,0 0 0 0 1280,211.98 L1599.116,211.98 A0,0 0 0 0 1599.116,211.98 L1599.116,176.568 L1589.116,166.568 L1443.5,166.568 L1439.5,148.313 L1435.5,166.568 L1280,166.568 A0,0 0 0 0 1280,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1589.116,166.568 L1589.116,176.568 L1599.116,176.568 L1589.116,166.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1286" y="185.465" fill="#000" font-size="13" textLength="298.116">Забытый пароль: /auth/password-reset/request</text><text x="1286" y="203.171" fill="#000" font-size="13" textLength="199.602">и /auth/password-reset/confirm.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="325.748,100.068,316.748,96.068,320.748,100.068,316.748,104.068,325.748,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M215.348,100.068 C250.747,100.068 285.318,100.068 320.748,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-link-type="dependency"><polygon points="724.364,100.068,715.364,96.068,719.364,100.068,715.364,104.068,724.364,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M536.015,100.068 C595.297,100.068 663.635,100.068 719.364,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk8" data-link-type="dependency"><polygon points="1008.752,100.068,999.752,96.068,1003.752,100.068,999.752,104.068,1008.752,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M895.694,100.068 C930.443,100.068 966.247,100.068 1003.752,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk9" data-link-type="dependency"><polygon points="1322.449,100.068,1313.449,96.068,1317.449,100.068,1313.449,104.068,1322.449,100.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1244.19,100.068 C1269.785,100.068 1291.879,100.068 1317.449,100.068" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="legend" data-source-line="30"><rect x="546.798" y="233.568" width="514.404" height="48.136" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="551.798" y="253.534" fill="#000" font-size="14" textLength="504.404">CJM отражает реализова